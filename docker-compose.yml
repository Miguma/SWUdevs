services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tambayayong_web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-Asia/Manila}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tambayayong}:${POSTGRES_PASSWORD:-tambayayong_dev_secret}@postgres:5432/${POSTGRES_DB:-tambayayong_db}
    depends_on:
      - postgres
    networks:
      - tambayayong_net

  postgres:
    image: postgres:16-alpine
    container_name: tambayayong_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tambayayong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tambayayong_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tambayayong_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tambayayong_net

volumes:
  postgres_data:

networks:
  tambayayong_net:
    driver: bridge
